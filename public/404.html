<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Wahyu Mahmudiyanto</title>
    <!-- Theme color (browser address bar color) -->
    <meta name="theme-color" content="#18181b" />
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <!-- Font Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="css/output.css" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/favicon.png" />
    <!-- Scroll behavior -->
    <style>
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>
  <body
    class="bg-gray-900 text-gray-200 flex items-center justify-center min-h-screen"
  >
    <div class="text-center px-6">
      <h1 class="text-7xl font-extrabold text-green-400 mb-4">404</h1>
      <h2 class="text-2xl font-semibold mb-4">Oops! Page Not Found</h2>
      <p class="text-gray-400 mb-8 max-w-md mx-auto">
        The page you’re looking for doesn’t exist, has been moved, or is
        temporarily unavailable.
      </p>
      <a
        href="index.html"
        class="inline-block bg-green-400 text-gray-900 font-semibold px-6 py-2 rounded-lg shadow hover:bg-green-300 transition"
      >
        ← Back to Home
      </a>
    </div>

    <!-- Glow Efect -->
    <div id="cursor-spotlight" class="glow-spot"></div>

    <script>
      const spotlight = document.getElementById("cursor-spotlight");
      window.addEventListener("mousemove", (e) => {
        spotlight.style.left = `${e.clientX}px`;
        spotlight.style.top = `${e.clientY}px`;
      });
    </script>
  </body>
</html>
